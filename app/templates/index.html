{% extends "layout.html" %}

{% block content %}
  <section class="card">
    <h3>Configuration</h3>
    <p>test: {% if test is not none %}{{ test }}{% else %}<em>not set</em>{% endif %}</p>
  </section>
  <section class="card">
    <p>Click the button to call <code>/api/ping</code> and show the response below.</p>
    <button id="pingBtn">Ping API</button>
    <div id="result" class="result"></div>
  </section>

  <section class="card">
    <h2>Simple Form</h2>
    <form id="demoForm">
      <label for="name">Name:</label>
      <input id="name" name="name" type="text" placeholder="Your name">
      <button type="submit">Submit</button>
    </form>
    <div id="formResult" class="result"></div>
  </section>
{% endblock %}
